<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>

  <!-- Calendar -->
  <rect x="24" y="28" width="80" height="72" rx="12" fill="none" stroke="#F3F4F6" stroke-width="6"/>
  <rect x="24" y="28" width="80" height="18" rx="10" fill="#5B6CFF"/>

  <!-- Calendar lines -->
  <line x1="24" y1="54" x2="104" y2="54" stroke="#F3F4F6" stroke-width="4" opacity="0.8"/>
  <line x1="41" y1="28" x2="41" y2="100" stroke="#F3F4F6" stroke-width="4" opacity="0.8"/>
  <line x1="59" y1="28" x2="59" y2="100" stroke="#F3F4F6" stroke-width="4" opacity="0.8"/>
  <line x1="77" y1="28" x2="77" y2="100" stroke="#F3F4F6" stroke-width="4" opacity="0.8"/>
  <line x1="95" y1="28" x2="95" y2="100" stroke="#F3F4F6" stroke-width="4" opacity="0.8"/>

  <!-- Main date number -->
  <text x="64" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF">30</text>

  <!-- Clock accent -->
  <circle cx="94" cy="92" r="18" fill="#F59E0B"/>
  <circle cx="94" cy="92" r="7" fill="#111827"/>
  <path d="M94 92 L94 83 M94 92 L98 98" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
</svg>
