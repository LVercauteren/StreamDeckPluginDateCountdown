<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdpi.css">

  <title>WoW Forever Countdown Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      padding: 4px 6px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 11px;
      color: #d8d8dc;
      background: #2d2d30;
    }

    .settings-content {
      width: calc(100% - 76px);
      height: 100%;
      margin: 0;
      padding: 0 6px 12px 0;
      overflow-y: scroll;
      overflow-x: hidden;
      transform: translateX(65px);
    }

    h3 {
      margin: 5px 0 4px;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 600;
      color: #e0e0e0;
    }

    p {
      margin: 0 0 6px;
      color: #b8b8b8;
      font-size: 10px;
      line-height: 1.3;
    }

    label {
      display: block;
      margin: 0 0 3px;
      color: #bfc0c6;
      font-size: 10px;
      line-height: 1.25;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 23px;
      padding: 3px 6px;
      font-family: inherit;
      font-size: 11px;
      border-radius: 3px;
    }

    input,
    select {
      color: #eeeeef;
      background: #3a3a3d;
      border: 1px solid #555558;
      color-scheme: dark;
    }

    input:focus,
    select:focus {
      border-color: #1684e8;
      outline: none;
    }

    input[type="range"] {
      min-height: 18px;
      padding: 0;
      margin: 0 0 3px;
      border: none;
      background: transparent;
    }

    input[type="range"]:focus {
      border: none;
      outline: none;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      min-width: 20px;
      max-width: 20px;
      height: 20px;
      min-height: 20px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }

    input[type="color"]:focus {
      border: none;
      outline: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    input[type="color"]::-moz-color-swatch {
      border: none;
      border-radius: 3px;
    }

    button {
      min-height: 23px;
      margin-top: 5px;
      color: #eeeeef;
      background: #414145;
      border: 1px solid #5a5a5e;
      cursor: pointer;
    }

    button:hover {
      background: #505055;
    }

    button:active {
      background: #303136;
    }

    hr {
      margin: 7px 0;
      border: 0;
      border-top: 1px solid #48494e;
    }

    .colors-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 3px 0 5px 0;
    }

    .color-inline-item {
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .color-inline-item label {
      margin: 0;
      font-size: 9px;
      flex-shrink: 0;
    }

    .compact-section {
      margin: 0;
    }

    .compact-section label {
      margin: 0 0 2px;
    }

    .compact-section input[type="range"] {
      margin: 0 0 1px;
    }

    #status {
      margin-top: 5px;
      color: #92949b;
      font-size: 10px;
      line-height: 1.3;
    }
  </style>
</head>

<body>
  <div class="settings-content">
    <h3>Countdown</h3>
    <p>Choose which countdown this button or dial shows. Changes apply immediately.</p>

    <label for="slotSelect">Countdown for this button</label>
    <select id="slotSelect"></select>

    <label for="slotName" style="margin-top: 6px;">Name</label>
    <input id="slotName" type="text" placeholder="e.g. Holiday">
    <label for="slotDate" style="margin-top: 6px;">Target date and time</label>
    <input id="slotDate" type="datetime-local" step="60">

    <div style="display: flex; gap: 6px; margin-top: 5px;">
      <button id="addSlotButton" type="button" style="flex: 1; margin-top: 0;">Add new</button>
      <button id="deleteSlotButton" type="button" style="flex: 1; margin-top: 0;">Delete</button>
    </div>

    <hr>
    <h3>Countdown Font Size</h3>
    <div class="compact-section">
      <label for="labelSize">Label size: <span id="labelSizeValue">18</span> px</label>
      <input id="labelSize" type="range" min="12" max="28" value="18">
      <label for="numberSize">Number size: <span id="numberSizeValue">40</span> px</label>
      <input id="numberSize" type="range" min="12" max="54" value="40">
    </div>

    <hr>
    <h3 id="colorSectionTitle">Countdown Colors</h3>
    <div class="colors-inline">
      <div class="color-inline-item">
        <label for="backgroundColor">BG:</label>
        <input id="backgroundColor" type="color" value="#111827">
      </div>
      <div class="color-inline-item">
        <label for="numberColor">Number:</label>
        <input id="numberColor" type="color" value="#FFFFFF">
      </div>
      <div class="color-inline-item">
        <label for="labelColor">Label:</label>
        <input id="labelColor" type="color" value="#D8D8DC">
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script>
    let socket;
    let pluginUUID;
    let currentActionUUID = null;
    let currentController = "Encoder";
    let countdownSlots = [];

    const statusEl = document.getElementById("status");
    const slotSelect = document.getElementById("slotSelect");
    const slotName = document.getElementById("slotName");
    const slotDate = document.getElementById("slotDate");
    const addSlotButton = document.getElementById("addSlotButton");
    const deleteSlotButton = document.getElementById("deleteSlotButton");
    const colorSectionTitle = document.getElementById("colorSectionTitle");

    const labelSize = document.getElementById("labelSize");
    const numberSize = document.getElementById("numberSize");
    const labelSizeValue = document.getElementById("labelSizeValue");
    const numberSizeValue = document.getElementById("numberSizeValue");
    const backgroundColor = document.getElementById("backgroundColor");
    const numberColor = document.getElementById("numberColor");
    const labelColor = document.getElementById("labelColor");

    const ACTION_NAMES = {
      "com.wowforever.countdown.days": "Days",
      "com.wowforever.countdown.hours": "Hours",
      "com.wowforever.countdown.minutes": "Minutes",
      "com.wowforever.countdown.seconds": "Seconds"
    };

    function updateStatus(message) {
      if (statusEl) statusEl.textContent = message;
    }

    function toLocalInputValue(isoDate) {
      const date = new Date(isoDate);
      if (Number.isNaN(date.getTime())) return "";
      const pad = n => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) +
        "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function send(message) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(message));
        return true;
      }
      return false;
    }

    function sendCommand(payload) {
      return send({ event: "sendToPlugin", context: pluginUUID, payload });
    }

    function debounce(fn, delay) {
      let handle = null;
      return function () {
        clearTimeout(handle);
        handle = setTimeout(fn, delay);
      };
    }

    function showSelectedSlotFields() {
      const slot = countdownSlots[Number(slotSelect.value)];
      slotName.value = slot ? slot.name || "" : "";
      slotDate.value = slot ? toLocalInputValue(slot.targetDate) : "";
    }

    function renderSlots(slots, selectedIndex) {
      countdownSlots = slots || [];
      slotSelect.innerHTML = "";

      countdownSlots.forEach((slot, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = slot.name || `Slot ${index + 1}`;
        slotSelect.appendChild(option);
      });

      const index = Number.isInteger(selectedIndex) ? selectedIndex : 0;
      slotSelect.value = String(Math.min(Math.max(index, 0), Math.max(countdownSlots.length - 1, 0)));
      showSelectedSlotFields();
    }

    window.connectElgatoStreamDeckSocket = function (port, uuid, registerEvent, info, actionInfo) {
      pluginUUID = uuid;

      let actionInfoObj = actionInfo;
      if (typeof actionInfoObj === "string") {
        try {
          actionInfoObj = JSON.parse(actionInfoObj);
        } catch {
          actionInfoObj = {};
        }
      }

      currentActionUUID = actionInfoObj?.action || null;
      currentController = actionInfoObj?.payload?.controller || actionInfoObj?.controller || "Encoder";

      if (currentActionUUID) {
        const actionName = ACTION_NAMES[currentActionUUID] || "Countdown";
        colorSectionTitle.textContent = `${actionName} Colors`;
      }

      socket = new WebSocket("ws://127.0.0.1:" + port);

      socket.onopen = function () {
        send({ event: registerEvent, uuid: pluginUUID });
        sendCommand({ command: "getCountdownSlots" });
        sendCommand({
          command: "getFontSettings",
          controller: currentController,
          action: currentActionUUID
        });
        sendCommand({
          command: "getColorSettings",
          controller: currentController,
          action: currentActionUUID
        });
        updateStatus("Loading saved settings…");
      };

      socket.onmessage = function (event) {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.event !== "sendToPropertyInspector") return;
        const payload = message.payload || {};

        if (payload.slots) {
          renderSlots(payload.slots, payload.selectedIndex);
          updateStatus("");
        }

        if (payload.slotError) {
          updateStatus(payload.slotError);
        }

        if (payload.colorsError) {
          updateStatus(payload.colorsError);
        }

        // Replies to our own saves must not overwrite controls the user may still be dragging.
        if (payload.fontSaved || payload.colorsSaved) {
          return;
        }

        if (payload.dialColors && currentController !== "Keypad") {
          backgroundColor.value = payload.dialColors.backgroundColor || "#111827";
          numberColor.value = payload.dialColors.numberColor || "#FFFFFF";
          labelColor.value = payload.dialColors.labelColor || "#D8D8DC";
        }

        if (payload.keypadColors && currentController === "Keypad") {
          const selected = payload.keypadColors[currentActionUUID];
          if (selected) {
            backgroundColor.value = selected.backgroundColor || "#111827";
            numberColor.value = selected.numberColor || "#FFFFFF";
            labelColor.value = selected.labelColor || "#D8D8DC";
          }
        }

        if (payload.labelSize !== undefined) {
          labelSize.value = payload.labelSize;
          labelSizeValue.textContent = payload.labelSize;
        }

        if (payload.numberSize !== undefined) {
          numberSize.value = payload.numberSize;
          numberSizeValue.textContent = payload.numberSize;
        }
      };

      socket.onerror = function () {
        updateStatus("Could not connect. Close and reopen Stream Deck settings.");
      };
    };

    // ---- Auto-apply: font sizes ----
    const applyFont = debounce(() => {
      sendCommand({
        command: "saveFontSettings",
        action: currentActionUUID,
        controller: currentController,
        labelSize: Number(labelSize.value),
        numberSize: Number(numberSize.value)
      });
    }, 100);

    labelSize.addEventListener("input", () => {
      labelSizeValue.textContent = labelSize.value;
      applyFont();
    });

    numberSize.addEventListener("input", () => {
      numberSizeValue.textContent = numberSize.value;
      applyFont();
    });

    // ---- Auto-apply: colors ----
    const applyColors = debounce(() => {
      sendCommand({
        command: "saveColorSettings",
        action: currentActionUUID,
        controller: currentController,
        colors: {
          backgroundColor: backgroundColor.value,
          numberColor: numberColor.value,
          labelColor: labelColor.value
        }
      });
    }, 100);

    [backgroundColor, numberColor, labelColor].forEach(el => {
      el.addEventListener("input", applyColors);
    });

    // ---- Slot selection and auto-apply of name/date edits ----
    slotSelect.addEventListener("change", () => {
      showSelectedSlotFields();
      sendCommand({ command: "selectCountdownSlot", index: Number(slotSelect.value) });
    });

    function readSlotFields(showErrors) {
      if (!slotDate.value) {
        if (showErrors) updateStatus("Please choose a date and time first.");
        return null;
      }
      const date = new Date(slotDate.value);
      if (Number.isNaN(date.getTime())) {
        if (showErrors) updateStatus("That date and time is not valid.");
        return null;
      }
      return { name: slotName.value.trim(), targetDate: date.toISOString() };
    }

    function applySlotEdit() {
      if (countdownSlots.length === 0) return;
      const fields = readSlotFields(false);
      if (!fields) return;
      sendCommand({
        command: "saveCountdownSlot",
        index: Number(slotSelect.value),
        name: fields.name,
        targetDate: fields.targetDate
      });
    }

    slotName.addEventListener("change", applySlotEdit);
    slotDate.addEventListener("change", applySlotEdit);

    addSlotButton.addEventListener("click", () => {
      const fields = readSlotFields(true);
      if (!fields) return;
      sendCommand({
        command: "addCountdownSlot",
        name: fields.name,
        targetDate: fields.targetDate
      });
    });

    deleteSlotButton.addEventListener("click", () => {
      if (countdownSlots.length === 0) return;
      sendCommand({ command: "deleteCountdownSlot", index: Number(slotSelect.value) });
    });
  </script>
</body>

</html>
