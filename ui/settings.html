<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdpi.css">

  <title>WoW Forever Countdown Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      padding: 4px 6px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 11px;
      color: #d8d8dc;
      background: #2d2d30;
    }

    .settings-content {
      width: calc(100% - 76px);
      height: 100%;
      margin: 0;
      padding: 0 6px 12px 0;
      overflow-y: scroll;
      overflow-x: hidden;
      transform: translateX(65px);
    }


    h3 {
      margin: 5px 0 4px;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 600;
      color: #e0e0e0;
    }

    p {
      margin: 0 0 6px;
      color: #b8b8b8;
      font-size: 10px;
      line-height: 1.3;
    }

    label {
      display: block;
      margin: 0 0 3px;
      color: #bfc0c6;
      font-size: 10px;
      line-height: 1.25;
    }

    input,
    button {
      width: 100%;
      min-height: 23px;
      padding: 3px 6px;
      font-family: inherit;
      font-size: 11px;
      border-radius: 3px;
    }

    input {
      color: #eeeeef;
      background: #3a3a3d;
      border: 1px solid #555558;
      color-scheme: dark;
    }

    input:focus {
      border-color: #1684e8;
      outline: none;
    }

    input[type="range"] {
      min-height: 18px;
      padding: 0;
      margin: 0 0 3px;
    }

    input[type="color"] {
      width: 34px;
      min-width: 34px;
      height: 22px;
      min-height: 22px;
      padding: 1px;
      cursor: pointer;
    }

    button {
      min-height: 23px;
      margin-top: 5px;
      color: #eeeeef;
      background: #414145;
      border: 1px solid #5a5a5e;
      cursor: pointer;
    }

    button:hover {
      background: #505055;
    }

    button:active {
      background: #303136;
    }

    hr {
      margin: 7px 0;
      border: 0;
      border-top: 1px solid #48494e;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin: 4px 0;
    }

    .color-row label {
      flex: 1;
      margin: 0;
    }

    #status {
      margin-top: 5px;
      color: #92949b;
      font-size: 10px;
      line-height: 1.3;
    }

    #targetDate {
      width: 180px;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <div class="settings-content">
    <h3>Date Countdown</h3>
    <p>Choose the shared target date and time for all four countdown actions.</p>

    <label for="targetDate">Target date and time</label>
    <input id="targetDate" type="datetime-local" step="60" placeholder="Loading saved date…">

    <hr>
    <h3>Countdown Font Size</h3>
    <label for="labelSize">Label size: <span id="labelSizeValue">18</span> px</label>
    <input id="labelSize" type="range" min="12" max="28" value="18">
    <label for="numberSize" style="margin-top: 12px;">Number size: <span id="numberSizeValue">40</span> px</label>
    <input id="numberSize" type="range" min="12" max="54" value="40">

    <hr>
    <h3 id="colorSectionTitle">Countdown Colors</h3>
    <div class="color-row">
      <label for="backgroundColor">Background color</label>
      <input id="backgroundColor" type="color" value="#111827">
    </div>
    <div class="color-row">
      <label for="numberColor">Number color</label>
      <input id="numberColor" type="color" value="#FFFFFF">
    </div>
    <div class="color-row">
      <label for="labelColor">Label color</label>
      <input id="labelColor" type="color" value="#D8D8DC">
    </div>
    <button id="saveAllButton" type="button">Save</button>

    <div id="status">Connecting to Stream Deck…</div>
  </div>

  <script>
    let socket;
    let pluginUUID;
    let savedTargetDate = null;
    let currentActionUUID = null;
    let currentController = "Encoder";

    const input = document.getElementById("targetDate");
    const statusEl = document.getElementById("status");
    const debug = document.getElementById("debug");
    const colorSectionTitle = document.getElementById("colorSectionTitle");

    const labelSize = document.getElementById("labelSize");
    const numberSize = document.getElementById("numberSize");
    const labelSizeValue = document.getElementById("labelSizeValue");
    const numberSizeValue = document.getElementById("numberSizeValue");
    const backgroundColor = document.getElementById("backgroundColor");
    const numberColor = document.getElementById("numberColor");
    const labelColor = document.getElementById("labelColor");
    const saveAllButton = document.getElementById("saveAllButton");

    const ACTION_NAMES = {
      "com.wowforever.countdown.days": "Days",
      "com.wowforever.countdown.hours": "Hours",
      "com.wowforever.countdown.minutes": "Minutes",
      "com.wowforever.countdown.seconds": "Seconds"
    };

    function updateStatus(message) {
      if (statusEl) {
        statusEl.textContent = message;
      }
    }

    function toLocalInputValue(date) {
      const pad = n => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function showTarget(isoDate) {
      const date = new Date(isoDate);
      if (!Number.isNaN(date.getTime())) {
        input.value = toLocalInputValue(date);
        savedTargetDate = date.toISOString();
      }
    }

    function send(message) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(message));
        return true;
      }
      return false;
    }

    window.connectElgatoStreamDeckSocket = function (port, uuid, registerEvent, info, actionInfo) {
      pluginUUID = uuid;

      let actionInfoObj = actionInfo;
      if (typeof actionInfoObj === "string") {
        try {
          actionInfoObj = JSON.parse(actionInfoObj);
        } catch {
          actionInfoObj = {};
        }
      }

      addDebug("Parsed actionInfo: " + JSON.stringify(actionInfoObj, null, 2));

      currentActionUUID = actionInfoObj?.action || null;
      currentController = actionInfoObj?.payload?.controller || actionInfoObj?.controller || "Encoder";

      addDebug("currentActionUUID = " + currentActionUUID);
      addDebug("currentController = " + currentController);

      if (currentActionUUID) {
        const actionName = ACTION_NAMES[currentActionUUID] || "Countdown";
        colorSectionTitle.textContent = `${actionName} Colors`;
      } else if (currentController === "Encoder") {
        colorSectionTitle.textContent = "Dials Colors";
      }

      socket = new WebSocket("ws://127.0.0.1:" + port);

      socket.onopen = function () {
        console.log("WoW Forever Countdown: Property Inspector connected.");
        addDebug("WebSocket connected");
        send({ event: registerEvent, uuid: pluginUUID });
        send({ event: "sendToPlugin", context: pluginUUID, payload: { command: "getTargetDate" } });
        send({
          event: "sendToPlugin",
          context: pluginUUID,
          payload: {
            command: "getFontSettings",
            controller: currentController,
            action: currentActionUUID
          }
        });
        send({
          event: "sendToPlugin",
          context: pluginUUID,
          payload: {
            command: "getColorSettings",
            controller: currentController,
            action: currentActionUUID
          }
        });
        updateStatus("Loading saved settings…");
      };

      socket.onmessage = function (event) {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.event === "sendToPropertyInspector") {
          const payload = message.payload || {};

          if (payload.dialColors && currentController === "Encoder") {
            backgroundColor.value = payload.dialColors.backgroundColor || "#111827";
            numberColor.value = payload.dialColors.numberColor || "#FFFFFF";
            labelColor.value = payload.dialColors.labelColor || "#D8D8DC";
          }

          if (payload.keypadColors && currentController === "Keypad") {
            const selected = payload.keypadColors[currentActionUUID];
            if (selected) {
              backgroundColor.value = selected.backgroundColor || "#111827";
              numberColor.value = selected.numberColor || "#FFFFFF";
              labelColor.value = selected.labelColor || "#D8D8DC";
            }
          }

          if (payload.labelSize !== undefined) {
            labelSize.value = payload.labelSize;
            labelSizeValue.textContent = payload.labelSize;
          }

          if (payload.numberSize !== undefined) {
            numberSize.value = payload.numberSize;
            numberSizeValue.textContent = payload.numberSize;
          }

          if (payload.targetDate) {
            showTarget(payload.targetDate);
            updateStatus("Settings loaded.");
          }
        }
      };

      socket.onerror = function () {
        updateStatus("Could not connect. Close and reopen Stream Deck settings.");
      };
    };

    labelSize.addEventListener("input", () => {
      labelSizeValue.textContent = labelSize.value;
    });

    numberSize.addEventListener("input", () => {
      numberSizeValue.textContent = numberSize.value;
    });


    saveAllButton.addEventListener("click", () => {
      console.log("WoW Forever Countdown: Save button clicked.");
      if (!input.value) {
        updateStatus("Please choose a date and time first.");
        return;
      }

      const chosenDate = new Date(input.value);

      if (Number.isNaN(chosenDate.getTime())) {
        updateStatus("That date and time is not valid.");
        return;
      }

      savedTargetDate = chosenDate.toISOString();

      // Save target date
      send({
        event: "sendToPlugin",
        context: pluginUUID,
        payload: {
          targetDate: savedTargetDate
        }
      });

      // Save font sizes
      send({
        event: "sendToPlugin",
        context: pluginUUID,
        payload: {
          command: "saveFontSettings",
          action: currentActionUUID,
          controller: currentController,
          labelSize: Number(labelSize.value),
          numberSize: Number(numberSize.value)
        }
      });

      // Save colors
      send({
        event: "sendToPlugin",
        context: pluginUUID,
        payload: {
          command: "saveColorSettings",
          action: currentActionUUID,
          controller: currentController,
          colors: {
            backgroundColor: backgroundColor.value,
            numberColor: numberColor.value,
            labelColor: labelColor.value
          }
        }
      });

      updateStatus("Saving all settings…");
    });
  </script>
</body>

</html>
