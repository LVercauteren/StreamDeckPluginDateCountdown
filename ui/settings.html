<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/barraider/streamdeck-easypi@latest/src/sdpi.css">

  <title>Date Countdown Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      padding: 4px 6px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 11px;
      color: #d8d8dc;
      background: #2d2d30;
    }

    .settings-content {
      width: calc(100% - 76px);
      height: 100%;
      margin: 0;
      padding: 0 6px 12px 0;
      overflow-y: scroll;
      overflow-x: hidden;
      transform: translateX(65px);
    }

    .hidden {
      display: none !important;
    }

    h3 {
      margin: 5px 0 4px;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 600;
      color: #e0e0e0;
    }

    p {
      margin: 0 0 6px;
      color: #b8b8b8;
      font-size: 10px;
      line-height: 1.3;
    }

    label {
      display: block;
      margin: 0 0 3px;
      color: #bfc0c6;
      font-size: 10px;
      line-height: 1.25;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 23px;
      padding: 3px 6px;
      font-family: inherit;
      font-size: 11px;
      border-radius: 3px;
    }

    input,
    select {
      color: #eeeeef;
      background: #3a3a3d;
      border: 1px solid #555558;
      color-scheme: dark;
    }

    input:focus,
    select:focus {
      border-color: #1684e8;
      outline: none;
    }

    input[type="range"] {
      min-height: 18px;
      padding: 0;
      margin: 0 0 3px;
      border: none;
      background: transparent;
    }

    input[type="range"]:focus {
      border: none;
      outline: none;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      min-width: 20px;
      max-width: 20px;
      height: 20px;
      min-height: 20px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }

    input[type="color"]:focus {
      border: none;
      outline: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 3px;
    }

    input[type="color"]::-moz-color-swatch {
      border: none;
      border-radius: 3px;
    }

    button {
      min-height: 23px;
      margin-top: 5px;
      color: #eeeeef;
      background: #414145;
      border: 1px solid #5a5a5e;
      cursor: pointer;
    }

    button:hover {
      background: #505055;
    }

    button:active {
      background: #303136;
    }

    button.danger {
      background: #7a2a2a;
      border-color: #a33b3b;
    }

    button.danger:hover {
      background: #8f3232;
    }

    hr {
      margin: 7px 0;
      border: 0;
      border-top: 1px solid #48494e;
    }

    .row {
      display: flex;
      gap: 6px;
      margin-top: 5px;
    }

    .row button {
      flex: 1;
      margin-top: 0;
    }

    .colors-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 3px 0 5px 0;
    }

    .color-inline-item {
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .color-inline-item label {
      margin: 0;
      font-size: 9px;
      flex-shrink: 0;
    }

    .compact-section {
      margin: 0;
    }

    .compact-section label {
      margin: 0 0 2px;
    }

    .compact-section input[type="range"] {
      margin: 0 0 1px;
    }

    #deleteWarning {
      margin: 5px 0 0;
      padding: 5px 6px;
      color: #f0c0c0;
      background: #3d2a2a;
      border: 1px solid #7a2a2a;
      border-radius: 3px;
      font-size: 10px;
      line-height: 1.3;
    }

    #status {
      margin-top: 5px;
      padding: 4px 6px;
      color: #92949b;
      font-size: 9px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      background: #1e1e1e;
      border-radius: 2px;
      border: 1px solid #3a3a3d;
      max-height: 120px;
      overflow-y: auto;
    }

    #status.error {
      color: #ff9999;
      background: #2a1a1a;
      border-color: #5a2a2a;
    }

    #status.success {
      color: #99ff99;
      background: #1a2a1a;
      border-color: #2a5a2a;
    }
  </style>
</head>

<body>
  <div class="settings-content">
    <h3>Countdown</h3>
    <p>Choose which countdown this <span id="deviceWord">button</span> shows. Changes apply immediately.</p>

    <label for="slotSelect">Countdown</label>
    <select id="slotSelect"></select>

    <label for="slotName" style="margin-top: 6px;">Name</label>
    <input id="slotName" type="text" placeholder="e.g. Holiday">
    <label for="slotDate" style="margin-top: 6px;">Target date and time</label>
    <input id="slotDate" type="datetime-local" step="60">

    <div class="row" id="slotButtons">
      <button id="updateSlotButton" type="button">Update</button>
      <button id="addSlotButton" type="button">Add new</button>
      <button id="deleteSlotButton" type="button">Delete</button>
    </div>

    <div id="deleteWarning" class="hidden">
      <div id="deleteWarningText"></div>
      <div class="row">
        <button id="confirmDeleteButton" type="button" class="danger">Yes, delete</button>
        <button id="cancelDeleteButton" type="button">Cancel</button>
      </div>
    </div>

    <hr>
    <h3>Countdown Font Size</h3>
    <div class="compact-section">
      <label for="labelSize">Label size: <span id="labelSizeValue">18</span> px</label>
      <input id="labelSize" type="range" min="12" max="28" value="18">
      <label for="numberSize">Number size: <span id="numberSizeValue">40</span> px</label>
      <input id="numberSize" type="range" min="12" max="54" value="40">
    </div>

    <div id="keypadOnly">
      <hr>
      <h3 id="colorSectionTitle">Countdown Colors</h3>
      <div class="colors-inline">
        <div class="color-inline-item">
          <label for="backgroundColor">BG:</label>
          <input id="backgroundColor" type="color" value="#111827">
        </div>
        <div class="color-inline-item">
          <label for="numberColor">Number:</label>
          <input id="numberColor" type="color" value="#FFFFFF">
        </div>
        <div class="color-inline-item">
          <label for="labelColor">Label:</label>
          <input id="labelColor" type="color" value="#D8D8DC">
        </div>
      </div>
    </div>

    <div id="dialOnly" class="hidden">
      <hr>
      <p>Dial colors are controlled by Stream Deck and can't be customized.</p>
    </div>

    <div id="status"></div>
  </div>

  <script>
    let socket;
    let pluginUUID;
    let currentActionUUID = null;
    let currentController = "Encoder";
    let countdownSlots = [];
    let deleteTimer = null;

    const $ = id => document.getElementById(id);

    const statusEl = $("status");
    const slotSelect = $("slotSelect");
    const slotName = $("slotName");
    const slotDate = $("slotDate");
    const updateSlotButton = $("updateSlotButton");
    const addSlotButton = $("addSlotButton");
    const deleteSlotButton = $("deleteSlotButton");
    const deleteWarning = $("deleteWarning");
    const deleteWarningText = $("deleteWarningText");
    const confirmDeleteButton = $("confirmDeleteButton");
    const cancelDeleteButton = $("cancelDeleteButton");
    const colorSectionTitle = $("colorSectionTitle");

    const labelSize = $("labelSize");
    const numberSize = $("numberSize");
    const labelSizeValue = $("labelSizeValue");
    const numberSizeValue = $("numberSizeValue");
    const backgroundColor = $("backgroundColor");
    const numberColor = $("numberColor");
    const labelColor = $("labelColor");

    const ACTION_NAMES = {
      "com.lvercauteren.datecountdown.days": "Days",
      "com.lvercauteren.datecountdown.hours": "Hours",
      "com.lvercauteren.datecountdown.minutes": "Minutes",
      "com.lvercauteren.datecountdown.seconds": "Seconds"
    };

    let statusMessages = [];

    function addStatus(message, type = "info") {
      statusMessages.push(message);
      if (statusMessages.length > 10) {
        statusMessages.shift();
      }

      statusEl.textContent = statusMessages.join("\n");
      statusEl.classList.remove("error", "success");
      if (type === "error") statusEl.classList.add("error");
      if (type === "success") statusEl.classList.add("success");

      console.log(`[${type.toUpperCase()}]`, message);
    }

    function clearStatus() {
      statusMessages = [];
      statusEl.textContent = "";
      statusEl.classList.remove("error", "success");
    }

    function isKeypad() {
      return currentController === "Keypad";
    }

    function applyControllerLayout() {
      const keypad = isKeypad();
      $("keypadOnly").classList.toggle("hidden", !keypad);
      $("dialOnly").classList.toggle("hidden", keypad);
      $("deviceWord").textContent = keypad ? "button" : "dial";
    }

    function toLocalInputValue(isoDate) {
      const date = new Date(isoDate);
      if (Number.isNaN(date.getTime())) return "";
      const pad = n => String(n).padStart(2, "0");
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) +
        "T" + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function send(message) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(message));
        return true;
      }
      return false;
    }

    function sendCommand(payload) {
      return send({ event: "sendToPlugin", context: pluginUUID, payload });
    }

    function debounce(fn, delay) {
      let handle = null;
      return function () {
        clearTimeout(handle);
        handle = setTimeout(fn, delay);
      };
    }

    function showSelectedSlotFields() {
      const slot = countdownSlots[Number(slotSelect.value)];
      slotName.value = slot ? slot.name || "" : "";
      slotDate.value = slot ? toLocalInputValue(slot.targetDate) : "";
    }

    function renderSlots(slots, selectedIndex) {
      countdownSlots = slots || [];
      slotSelect.innerHTML = "";

      countdownSlots.forEach((slot, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = slot.name || `Slot ${index + 1}`;
        slotSelect.appendChild(option);
      });

      const index = Number.isInteger(selectedIndex) ? selectedIndex : 0;
      slotSelect.value = String(Math.min(Math.max(index, 0), Math.max(countdownSlots.length - 1, 0)));
      showSelectedSlotFields();
      hideDeleteWarning();
    }

    function hideDeleteWarning() {
      clearTimeout(deleteTimer);
      deleteTimer = null;
      deleteWarning.classList.add("hidden");
      $("slotButtons").classList.remove("hidden");
    }

    updateSlotButton.addEventListener("click", () => {
      if (countdownSlots.length === 0) return;
      const fields = readSlotFields(true);
      if (!fields) return;
      sendCommand({
        command: "saveCountdownSlot",
        index: Number(slotSelect.value),
        name: fields.name,
        targetDate: fields.targetDate
      });
      addStatus("Countdown updated.", "success");
    });

    deleteSlotButton.addEventListener("click", () => {
      if (countdownSlots.length === 0) return;

      if (countdownSlots.length <= 1) {
        addStatus("You need at least one countdown.", "error");
        return;
      }

      const slot = countdownSlots[Number(slotSelect.value)];
      const name = slot && slot.name ? `"${slot.name}"` : "this countdown";
      deleteWarningText.textContent =
        `Delete ${name}? Any button or dial using it will switch to the first countdown. This can't be undone.`;
      deleteWarning.classList.remove("hidden");
      $("slotButtons").classList.add("hidden");

      clearTimeout(deleteTimer);
      deleteTimer = setTimeout(hideDeleteWarning, 8000);
    });

    cancelDeleteButton.addEventListener("click", hideDeleteWarning);

    confirmDeleteButton.addEventListener("click", () => {
      const index = Number(slotSelect.value);
      hideDeleteWarning();
      if (!countdownSlots[index]) return;
      sendCommand({ command: "deleteCountdownSlot", index });
    });

    window.connectElgatoStreamDeckSocket = function (port, uuid, registerEvent, info, actionInfo) {
      pluginUUID = uuid;

      let actionInfoObj = actionInfo;
      if (typeof actionInfoObj === "string") {
        try {
          actionInfoObj = JSON.parse(actionInfoObj);
        } catch {
          actionInfoObj = {};
        }
      }

      currentActionUUID = actionInfoObj?.action || null;
      currentController = actionInfoObj?.payload?.controller || actionInfoObj?.controller || "Encoder";

      applyControllerLayout();

      if (currentActionUUID) {
        const actionName = ACTION_NAMES[currentActionUUID] || "Countdown";
        colorSectionTitle.textContent = `${actionName} Colors`;
      }

      socket = new WebSocket("ws://127.0.0.1:" + port);

      socket.onopen = function () {
        send({ event: registerEvent, uuid: pluginUUID });
        sendCommand({ command: "getCountdownSlots" });
        sendCommand({
          command: "getFontSettings",
          controller: currentController,
          action: currentActionUUID
        });

        if (isKeypad()) {
          sendCommand({
            command: "getColorSettings",
            controller: currentController,
            action: currentActionUUID
          });
        }

        addStatus("Loading saved settings…");
      };

      socket.onmessage = function (event) {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.event !== "sendToPropertyInspector") return;
        const payload = message.payload || {};

        if (payload.slots) {
          renderSlots(payload.slots, payload.selectedIndex);
          clearStatus();
        }

        if (payload.slotError) addStatus(payload.slotError, "error");
        if (payload.colorsError) addStatus(payload.colorsError, "error");

        if (payload.fontSaved || payload.colorsSaved) return;

        if (payload.colors && isKeypad()) {
          const selected = payload.colors;
          backgroundColor.value = selected.backgroundColor || "#111827";
          numberColor.value = selected.numberColor || "#FFFFFF";
          labelColor.value = selected.labelColor || "#D8D8DC";
        }

        if (payload.labelSize !== undefined) {
          labelSize.value = payload.labelSize;
          labelSizeValue.textContent = payload.labelSize;
        }

        if (payload.numberSize !== undefined) {
          numberSize.value = payload.numberSize;
          numberSizeValue.textContent = payload.numberSize;
        }
      };

      socket.onerror = function () {
        addStatus("Could not connect. Close and reopen Stream Deck settings.", "error");
      };
    };

    const applyFont = debounce(() => {
      sendCommand({
        command: "saveFontSettings",
        action: currentActionUUID,
        controller: currentController,
        labelSize: Number(labelSize.value),
        numberSize: Number(numberSize.value)
      });
    }, 100);

    labelSize.addEventListener("input", () => {
      labelSizeValue.textContent = labelSize.value;
      applyFont();
    });

    numberSize.addEventListener("input", () => {
      numberSizeValue.textContent = numberSize.value;
      applyFont();
    });

    const applyColors = debounce(() => {
      if (!isKeypad()) return;
      sendCommand({
        command: "saveColorSettings",
        action: currentActionUUID,
        controller: currentController,
        colors: {
          backgroundColor: backgroundColor.value,
          numberColor: numberColor.value,
          labelColor: labelColor.value
        }
      });
    }, 100);

    [backgroundColor, numberColor, labelColor].forEach(el => {
      el.addEventListener("input", applyColors);
    });

    slotSelect.addEventListener("change", () => {
      hideDeleteWarning();
      showSelectedSlotFields();
      sendCommand({ command: "selectCountdownSlot", index: Number(slotSelect.value) });
    });

    function readSlotFields(showErrors) {
      if (!slotDate.value) {
        if (showErrors) addStatus("Please choose a date and time first.", "error");
        return null;
      }
      const date = new Date(slotDate.value);
      if (Number.isNaN(date.getTime())) {
        if (showErrors) addStatus("That date and time is not valid.", "error");
        return null;
      }
      return { name: slotName.value.trim(), targetDate: date.toISOString() };
    }

    slotName.addEventListener("change", () => {
      if (countdownSlots.length === 0) return;
      const fields = readSlotFields(false);
      if (!fields) return;
      sendCommand({
        command: "saveCountdownSlot",
        index: Number(slotSelect.value),
        name: fields.name,
        targetDate: fields.targetDate
      });
    });

    slotDate.addEventListener("change", () => {
      if (countdownSlots.length === 0) return;
      const fields = readSlotFields(false);
      if (!fields) return;
      sendCommand({
        command: "saveCountdownSlot",
        index: Number(slotSelect.value),
        name: fields.name,
        targetDate: fields.targetDate
      });
    });

    addSlotButton.addEventListener("click", () => {
      const fields = readSlotFields(true);
      if (!fields) return;
      sendCommand({
        command: "addCountdownSlot",
        name: fields.name,
        targetDate: fields.targetDate
      });
    });
  </script>
</body>

</html>
